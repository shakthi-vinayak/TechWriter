<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechWrite Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --bg: #0c0e12;
        --bg2: #13161c;
        --card: #1a1e27;
        --elevated: #222733;
        --border: #2d3340;
        --border-h: #3d4455;
        --text: #e8e4df;
        --text2: #9ca0ab;
        --muted: #5c6070;
        --accent: #e5a00d;
        --accent-h: #f0b429;
        --accent-s: rgba(229, 160, 13, 0.1);
        --accent-b: rgba(229, 160, 13, 0.25);
        --success: #34d399;
        --error: #f87171;
        --info: #60a5fa;
        --code-bg: #0f1117;
        --code-t: #2dd4bf;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Space Grotesk", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }
      code,
      pre,
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        transition: border-color 0.2s;
      }
      .card:hover {
        border-color: var(--border-h);
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text2);
        margin-bottom: 10px;
        display: block;
      }
      .topic-input {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        resize: vertical;
        min-height: 80px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
      }
      .topic-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-s);
      }
      .topic-input::placeholder {
        color: var(--muted);
      }
      .style-btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg2);
        color: var(--text2);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
      }
      .style-btn:hover {
        border-color: var(--border-h);
        color: var(--text);
      }
      .style-btn.active {
        border-color: var(--accent-b);
        background: var(--accent-s);
        color: var(--accent);
      }
      .source-check {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .source-check:hover {
        background: var(--bg2);
      }
      .source-check input[type="checkbox"] {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-radius: 4px;
        background: var(--bg2);
        cursor: pointer;
        transition: all 0.15s;
        position: relative;
        flex-shrink: 0;
      }
      .source-check input[type="checkbox"]:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .source-check input[type="checkbox"]:checked::after {
        content: "\2713";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #000;
        font-size: 12px;
        font-weight: 700;
      }
      .source-check span {
        font-size: 14px;
        color: var(--text2);
      }
      .plat-chip {
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .plat-chip:hover {
        border-color: var(--border-h);
        color: var(--text);
      }
      .plat-chip.active {
        border-color: var(--accent-b);
        background: var(--accent-s);
        color: var(--accent);
      }
      .gen-btn {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, var(--accent), #d48800);
        color: #000;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .gen-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 30px rgba(229, 160, 13, 0.25);
      }
      .gen-btn:active {
        transform: translateY(0);
      }
      .gen-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .tab-bar {
        display: flex;
        gap: 2px;
        background: var(--bg2);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .tab-item {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--text2);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tab-item:hover {
        color: var(--text);
      }
      .tab-item.active {
        background: var(--card);
        color: var(--accent);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .action-btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg2);
        color: var(--text2);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .action-btn:hover {
        border-color: var(--border-h);
        color: var(--text);
        background: var(--elevated);
      }
      .article-body {
        line-height: 1.75;
        font-size: 15px;
        color: var(--text);
      }
      .article-body h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .article-body h2 {
        font-size: 20px;
        font-weight: 700;
        margin: 28px 0 12px;
      }
      .article-body h3 {
        font-size: 17px;
        font-weight: 600;
        margin: 20px 0 8px;
      }
      .article-body p {
        margin-bottom: 14px;
        color: var(--text2);
      }
      .article-body ul,
      .article-body ol {
        margin: 12px 0;
        padding-left: 24px;
        color: var(--text2);
      }
      .article-body li {
        margin-bottom: 6px;
      }
      .article-body strong {
        color: var(--text);
        font-weight: 600;
      }
      .article-body blockquote {
        border-left: 3px solid var(--accent);
        padding: 12px 20px;
        margin: 16px 0;
        background: var(--accent-s);
        border-radius: 0 8px 8px 0;
        color: var(--text);
        font-style: italic;
      }
      .article-body pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 20px;
        margin: 16px 0;
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.6;
        color: var(--code-t);
      }
      .article-body code:not(pre code) {
        background: var(--elevated);
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 13px;
        color: var(--code-t);
      }
      .article-body hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 28px 0;
      }
      .article-body .hashtags {
        color: var(--accent);
        font-weight: 500;
      }
      .article-body .tweet {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 18px;
        margin: 8px 0;
        background: var(--bg2);
      }
      .article-body .tweet-num {
        color: var(--accent);
        font-weight: 700;
        margin-right: 6px;
      }
      .suggestion-chip {
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text2);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
        line-height: 1.4;
      }
      .suggestion-chip:hover {
        border-color: var(--accent-b);
        color: var(--text);
        background: var(--accent-s);
        transform: translateY(-1px);
      }
      .source-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px;
        border-radius: 8px;
        background: var(--bg2);
        border: 1px solid var(--border);
      }
      .source-item .src-icon {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 13px;
      }
      .source-item .src-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 2px;
      }
      .source-item .src-url {
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
      .toast {
        padding: 14px 20px;
        border-radius: 10px;
        background: var(--elevated);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: toastIn 0.3s ease-out;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        max-width: 420px;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(20px);
        }
      }
      .progress-bar {
        height: 3px;
        background: var(--bg2);
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-h));
        border-radius: 2px;
        transition: width 0.3s;
        width: 0%;
      }
      .status-msg {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 20px;
      }
      .status-msg .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
      }
      .empty-icon {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: var(--accent-s);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: var(--accent);
        margin-bottom: 20px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-up {
        animation: fadeUp 0.4s ease-out both;
      }
      #errorBanner {
        display: none;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 16px;
        color: var(--error);
        font-size: 13px;
        font-family: "JetBrains Mono", monospace;
        word-break: break-word;
      }
      #initCheck {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 10px;
        color: var(--success);
        opacity: 0.5;
        z-index: 999;
        pointer-events: none;
      }
      .main-grid {
        display: grid;
        grid-template-columns: 400px 1fr;
        gap: 24px;
        max-width: 1560px;
        margin: 0 auto;
        padding: 24px;
      }
      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div style="position: fixed; inset: 0; pointer-events: none; z-index: 0">
      <div
        style="
          position: absolute;
          top: -10%;
          left: 15%;
          width: 500px;
          height: 500px;
          background: radial-gradient(
            circle,
            rgba(229, 160, 13, 0.06) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        style="
          position: absolute;
          bottom: -10%;
          right: 10%;
          width: 400px;
          height: 400px;
          background: radial-gradient(
            circle,
            rgba(45, 212, 191, 0.04) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        style="
          position: absolute;
          inset: 0;
          background-image: radial-gradient(
            rgba(255, 255, 255, 0.02) 1px,
            transparent 1px
          );
          background-size: 32px 32px;
        "
      ></div>
    </div>
    <div style="position: relative; z-index: 1">
      <header
        style="
          border-bottom: 1px solid var(--border);
          background: rgba(12, 14, 18, 0.8);
          backdrop-filter: blur(20px);
          position: sticky;
          top: 0;
          z-index: 50;
        "
      >
        <div
          style="
            max-width: 1560px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <div
              style="
                width: 38px;
                height: 38px;
                border-radius: 10px;
                background: linear-gradient(135deg, var(--accent), #d48800);
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <i
                class="fa-solid fa-feather-pointed"
                style="color: #000; font-size: 16px"
              ></i>
            </div>
            <div>
              <div
                style="
                  font-size: 17px;
                  font-weight: 700;
                  letter-spacing: -0.02em;
                "
              >
                TechWrite Agent
              </div>
              <div
                style="font-size: 11px; color: var(--muted); margin-top: -1px"
              >
                Platform-ready technical articles from your knowledge base
              </div>
            </div>
          </div>
          <span
            style="
              font-size: 11px;
              color: var(--muted);
              background: var(--bg2);
              padding: 4px 10px;
              border-radius: 6px;
              border: 1px solid var(--border);
            "
            ><i
              class="fa-solid fa-database"
              style="margin-right: 4px; color: var(--accent)"
            ></i
            >5 domains loaded</span
          >
        </div>
      </header>
      <main class="main-grid">
        <aside style="display: flex; flex-direction: column; gap: 16px">
          <div class="card">
            <label class="label"
              ><i
                class="fa-solid fa-pen-to-square"
                style="margin-right: 4px"
              ></i>
              Topic</label
            ><textarea
              id="topicInput"
              class="topic-input"
              placeholder="e.g., Kubernetes security best practices for production clusters in 2024"
              rows="3"
            ></textarea>
          </div>
          <div class="card">
            <label class="label"
              ><i class="fa-solid fa-circle-info" style="margin-right: 4px"></i>
              Additional Context
              <span
                style="
                  color: var(--muted);
                  font-weight: 400;
                  text-transform: none;
                  letter-spacing: 0;
                "
                >(optional)</span
              ></label
            ><textarea
              id="contextInput"
              class="topic-input"
              placeholder="Company name, product, specific angle, target audience..."
              rows="2"
              style="min-height: 56px; font-size: 13px"
            ></textarea>
          </div>
          <div class="card">
            <label class="label"
              ><i
                class="fa-solid fa-wand-magic-sparkles"
                style="margin-right: 4px"
              ></i>
              Article Style</label
            >
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"
              id="styleSelector"
            >
              <button class="style-btn active" data-style="deep-dive">
                <i
                  class="fa-solid fa-microscope"
                  style="margin-right: 6px; font-size: 11px"
                ></i
                >Technical Deep-Dive
              </button>
              <button class="style-btn" data-style="thought-leadership">
                <i
                  class="fa-solid fa-lightbulb"
                  style="margin-right: 6px; font-size: 11px"
                ></i
                >Thought Leadership
              </button>
              <button class="style-btn" data-style="tutorial">
                <i
                  class="fa-solid fa-graduation-cap"
                  style="margin-right: 6px; font-size: 11px"
                ></i
                >Tutorial / How-To
              </button>
              <button class="style-btn" data-style="news-analysis">
                <i
                  class="fa-solid fa-newspaper"
                  style="margin-right: 6px; font-size: 11px"
                ></i
                >News Analysis
              </button>
            </div>
          </div>
          <div class="card">
            <label class="label"
              ><i class="fa-solid fa-folder-open" style="margin-right: 4px"></i>
              Information Sources</label
            >
            <div
              style="display: flex; flex-direction: column; gap: 2px"
              id="sourceSelector"
            >
              <label class="source-check"
                ><input type="checkbox" value="blog" checked /><span
                  ><i
                    class="fa-solid fa-rss"
                    style="width: 16px; color: var(--accent); margin-right: 2px"
                  ></i>
                  Company Blog</span
                ></label
              >
              <label class="source-check"
                ><input type="checkbox" value="kb" checked /><span
                  ><i
                    class="fa-solid fa-book"
                    style="width: 16px; color: var(--info); margin-right: 2px"
                  ></i>
                  Knowledge Base</span
                ></label
              >
              <label class="source-check"
                ><input type="checkbox" value="help" /><span
                  ><i
                    class="fa-solid fa-circle-question"
                    style="
                      width: 16px;
                      color: var(--success);
                      margin-right: 2px;
                    "
                  ></i>
                  Help Pages</span
                ></label
              >
              <label class="source-check"
                ><input type="checkbox" value="industry" checked /><span
                  ><i
                    class="fa-solid fa-chart-line"
                    style="width: 16px; color: var(--error); margin-right: 2px"
                  ></i>
                  Industry Reports</span
                ></label
              >
            </div>
          </div>
          <div class="card">
            <label class="label"
              ><i class="fa-solid fa-share-nodes" style="margin-right: 4px"></i>
              Target Platforms</label
            >
            <div
              style="display: flex; flex-wrap: wrap; gap: 8px"
              id="platformSelector"
            >
              <button class="plat-chip active" data-platform="linkedin">
                <i class="fa-brands fa-linkedin-in"></i> LinkedIn
              </button>
              <button class="plat-chip active" data-platform="devto">
                <i class="fa-brands fa-dev"></i> Dev.to
              </button>
              <button class="plat-chip" data-platform="medium">
                <i class="fa-brands fa-medium"></i> Medium
              </button>
              <button class="plat-chip" data-platform="hashnode">
                <i class="fa-solid fa-code"></i> Hashnode
              </button>
              <button class="plat-chip" data-platform="xthread">
                <i class="fa-brands fa-x-twitter"></i> X Thread
              </button>
            </div>
          </div>
          <button class="gen-btn" id="generateBtn">
            <i class="fa-solid fa-bolt"></i> Generate Articles
          </button>
          <div
            style="
              font-size: 11px;
              color: var(--muted);
              text-align: center;
              padding: 0 8px;
            "
          >
            <i
              class="fa-solid fa-circle-exclamation"
              style="margin-right: 4px"
            ></i
            >AI-assisted draft &#8212; review before publishing
          </div>
        </aside>
        <div>
          <div id="errorBanner"></div>
          <div id="emptyState" class="card" style="min-height: 600px">
            <div class="empty-state">
              <div class="empty-icon"><i class="fa-solid fa-robot"></i></div>
              <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px">
                Ready to write
              </h2>
              <p
                style="
                  color: var(--text2);
                  font-size: 14px;
                  margin-bottom: 28px;
                  max-width: 380px;
                "
              >
                Enter a topic or pick a suggestion. The agent will craft
                platform-optimized articles from your knowledge base.
              </p>
              <div
                style="
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 10px;
                  max-width: 520px;
                  width: 100%;
                "
              >
                <button

        function pickRandom(a, n) {
          var s = a.slice().sort(function () {
            return Math.random() - 0.5;
          });
          return s.slice(0, Math.min(n, a.length));
        }
        function titleCase(s) {
          return s
            .replace(/\b\w/g, function (c) {
              return c.toUpperCase();
            })
            .replace(/\s+/g, " ")
            .trim();
        }
        function escHtml(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
        function detectLang(c) {
          if (c.indexOf("apiVersion:") !== -1 || c.indexOf("kind:") !== -1)
            return "yaml";
          if (c.indexOf("def ") !== -1) return "python";
          if (c.indexOf("export default") !== -1 || c.indexOf("const ") !== -1)
            return "javascript";
          if (c.indexOf("kubectl") !== -1 || c.indexOf("#!") !== -1)
            return "bash";
          return "text";

              score = 0;
            for (var k = 0; k < data.keywords.length; k++) {
              var kw = data.keywords[k];
              if (lower.indexOf(kw) !== -1) score += 10;
              var words = kw.split(" ");
              if (words.length > 1)

                  if (words[w].length > 3 && lower.indexOf(words[w]) !== -1)
                    score += 2;
            }
            if (score > 0) scores[cat] = score;
          }
          return scores;

            '"\ndate: "' +
            new Date().toISOString().split("T")[0] +
            '"\ntags: [' +
            Object.keys(c.matchedTopics)
              .map(function (t) {
                return '"' + t + '"';
              })
              .join(", ") +
            "]\n---\n\n";
          m +=
            "## Introduction\n\n" +
            (c.hooks[0] || "Let's explore " + c.topic + " in depth.") +
            "\n\nIn this article, we will cover:\n\n";
          for (var i = 0; i < c.sections.length; i++)
            m += "- " + c.sections[i].title + "\n";
          m += "\n---\n\n";
          for (var i = 0; i < c.sections.length; i++) {
            var s = c.sections[i];
            m += "## " + s.title + "\n\n" + s.content + "\n\n";
            if (s.code)
              m +=
                "```" +
                (s.codeLang || detectLang(s.code)) +
                "\n" +
                s.code.trim() +
                "\n```\n\n";
          }
          if (c.codeSnippets.length > 0) {
            m += "## Practical Examples\n\n";
            for (var i = 0; i < c.codeSnippets.length; i++) {
              var cs = c.codeSnippets[i];
              m +=
                "### " +
                cs.label +
                "\n\n```" +
                cs.lang +
                "\n" +
                cs.code.trim() +
                "\n```\n\n";
            }
          }
          m += "## Key Takeaways\n\n";
          for (var i = 0; i < c.bestPractices.length; i++)
            m += i + 1 + ". **" + c.bestPractices[i] + "**\n";
          m += "\n## References\n\n";
          for (var i = 0; i < c.stats.length; i++)
            m += "- " + c.stats[i] + "\n";
          m +=
            "\n---\n\n*Thanks for reading! Follow me on Hashnode for more technical content.*";
          return m;
        }

        function formatXThread(c) {
          var tweets = [];
          tweets.push(
            c.hooks[0] ||
              "Most teams get " +
                c.topic +
                " wrong. Here is a thread on what actually works.",
          );
          if (c.style === "tutorial") {
            for (var i = 0; i < c.bestPractices.length; i++)
              tweets.push(i + 1 + "/ " + c.bestPractices[i]);
          } else {
            for (var i = 0; i < c.sections.length; i++) {
              var s = c.sections[i],
                sentences = s.content.split(". ").filter(function (x) {
                  return x.trim();
                }),
                cur = i + 1 + "/ " + s.title + ":";
              for (var j = 0; j < Math.min(3, sentences.length); j++) {
                var add = " " + sentences[j] + ".";
                if ((cur + add).length > 260) {
                  tweets.push(cur.trim());
                  cur = sentences[j] + ".";
                } else cur += add;
              }
              if (cur.trim()) tweets.push(cur.trim());
            }
          }
          if (c.stats.length > 0) tweets.push("\uD83D\uDCCA " + c.stats[0]);
          tweets.push(c.ctas[0] || "Thoughts?");
          if (tweets.length < 5)
            for (var i = 0; i < Math.min(3, c.bestPractices.length); i++)
              if (tweets.indexOf(c.bestPractices[i]) === -1)
                tweets.splice(
                  tweets.length - 1,
                  0,
                  "\u2192 " + c.bestPractices[i],
                );
          return tweets
            .map(function (t) {
              return t.length > 270 ? t.substring(0, 267) + "..." : t;
            })
            .join("\n\n");
        }

        /* ====== MARKDOWN TO HTML ====== */
        function mdToHtml(md, platform) {
          if (platform === "xthread") {
            var tweets = md.split("\n\n");
            return tweets
              .map(function (t, i) {
                return (
                  '<div class="tweet"><span class="tweet-num">' +
                  (i + 1) +
                  "/</span>" +
                  escHtml(t) +
                  "</div>"
                );
              })
              .join("");
          }
          var h = escHtml(md);
          h = h.replace(/^### (.+)$/gm, "<h3>$1</h3>");
          h = h.replace(/^## (.+)$/gm, "<h2>$1</h2>");
          h = h.replace(/^# (.+)$/gm, "<h1>$1</h1>");
          h = h.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
          h = h.replace(/<\/blockquote>\n<blockquote>/g, "\n");
          h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
          h = h.replace(/\*(.+?)\*/g, "<em>$1</em>");
          h = h.replace(
            /```(\w*)\n([\s\S]*?)```/g,
            "<pre><code>$2</code></pre>",
          );
          h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
          h = h.replace(/^---$/gm, "<hr>");
          h = h.replace(/^- (.+)$/gm, "<li>$1</li>");
          h = h.replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>");
          h = h.replace(
            /^(\d+)\. \*\*(.+?)\*\* (.+)$/gm,
            "<li><strong>$2</strong> $3</li>",
          );
          h = h.replace(/^(\d+)\. (.+)$/gm, "<li>$2</li>");
          h = h.replace(/(#\w+)/g, '<span class="hashtags">$1</span>');
          h = h.replace(
            /^(?!<[hupob]|<li|<hr|<pre|<code)(.*\S.*)$/gm,
            function (m) {
              if (m.indexOf('<span class="hashtags">') !== -1)
                return "<p>" + m + "</p>";
              return "<p>" + m + "</p>";
            },
          );
          h = h.replace(/<p>\s*<\/p>/g, "");
          return h;
        }

        /* ====== GENERATE ====== */
        async function handleGenerate() {
          var topic = document.getElementById("topicInput").value.trim();
          if (!topic) {
            showToast("Please enter a topic first", "warning");
            return;
          }
          if (state.platforms.length === 0) {
            showToast("Select at least one platform", "warning");
            return;
          }
          if (state.isGenerating) return;
          state.isGenerating = true;
          var btn = document.getElementById("generateBtn");
          btn.disabled = true;
          btn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
          document.getElementById("emptyState").style.display = "none";
          document.getElementById("outputState").style.display = "none";
          document.getElementById("generatingState").style.display = "block";
          var steps = [
            {
              msg: "Analyzing topic and matching knowledge domains...",
              pct: 15,
            },
            { msg: "Querying knowledge base and sources...", pct: 35 },
            { msg: "Assembling content blocks...", pct: 55 },
            {
              msg:
                "Formatting for " +
                state.platforms
                  .map(function (p) {
                    return PLATFORMS[p].name;
                  })
                  .join(", ") +
                "...",
              pct: 75,
            },
            { msg: "Adding source attribution...", pct: 90 },
            { msg: "Finalizing articles...", pct: 100 },
          ];
          for (var i = 0; i < steps.length; i++) {
            document.getElementById("statusMsg").innerHTML =
              '<span class="dot"></span> ' + steps[i].msg;
            document.getElementById("progressFill").style.width =
              steps[i].pct + "%";
            await sleep(400 + Math.random() * 300);
          }
          var matched = matchTopic(topic);
          if (Object.keys(matched).length === 0) matched.devops = 5;
          var content = assembleContent(topic, state.style, matched);
          state.articles = {};
          var formatters = {
            linkedin: formatLinkedIn,
            devto: formatDevTo,
            medium: formatMedium,
            hashnode: formatHashnode,
            xthread: formatXThread,
          };
          for (var i = 0; i < state.platforms.length; i++) {
            var p = state.platforms[i];
            state.articles[p] = formatters[p](content);
          }
          state.activePlatform = state.platforms[0];
          state.relevantSources = getRelevantSources(matched, state.sources);
          await sleep(300);
          document.getElementById("generatingState").style.display = "none";
          document.getElementById("outputState").style.display = "block";
          renderTabs();
          renderArticle(state.activePlatform);
          renderSources();
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Generate Articles';
          state.isGenerating = false;
          showToast(
            "Generated " +
              state.platforms.length +
              " article" +
              (state.platforms.length > 1 ? "s" : "") +
              " successfully",
            "success",
          );
        }

        function renderTabs() {
          var bar = document.getElementById("tabBar");
          bar.innerHTML = state.platforms
            .map(function (p) {
              return (
                '<button class="tab-item ' +
                (p === state.activePlatform ? "active" : "") +
                '" data-p="' +
                p +
                '"><i class="' +
                PLATFORMS[p].icon +
                '"></i> ' +
                PLATFORMS[p].name +
                "</button>"
              );
            })
            .join("");
          bar.onclick = function (e) {
            var btn = e.target.closest(".tab-item");
            if (!btn) return;
            state.activePlatform = btn.dataset.p;
            document.querySelectorAll(".tab-item").forEach(function (t) {
              t.classList.toggle(
                "active",
                t.dataset.p === state.activePlatform,
              );
            });
            renderArticle(state.activePlatform);
          };
        }

        function renderArticle(platform) {
          var raw = state.articles[platform];
          if (!raw) return;
          var words = raw.split(/\s+/).filter(Boolean).length,
            chars = raw.length,
            readMin = Math.max(1, Math.round(words / 200));
          document.getElementById("wordCount").innerHTML =
            '<i class="fa-solid fa-font" style="margin-right:4px"></i>' +
            words.toLocaleString() +
            " words";
          document.getElementById("charCount").innerHTML =
            '<i class="fa-solid fa-text-width" style="margin-right:4px"></i>' +
            chars.toLocaleString() +
            " chars";
          document.getElementById("readTime").innerHTML =
            '<i class="fa-regular fa-clock" style="margin-right:4px"></i>' +
            readMin +
            " min read";
          var container = document.getElementById("articleBody");
          container.innerHTML = mdToHtml(raw, platform);
          container.classList.add("fade-up");
          setTimeout(function () {
            container.classList.remove("fade-up");
          }, 400);
        }

        function renderSources() {
          var list = document.getElementById("sourcesList");
          if (state.relevantSources.length === 0) {
            list.innerHTML =
              '<p style="color:var(--muted);font-size:13px;grid-column:1/-1">No specific sources matched.</p>';
            return;
          }
          var tc = {
            blog: { color: "var(--accent)", icon: "fa-solid fa-rss" },
            kb: { color: "var(--info)", icon: "fa-solid fa-book" },
            help: {
              color: "var(--success)",
              icon: "fa-solid fa-circle-question",
            },
            industry: { color: "var(--error)", icon: "fa-solid fa-chart-line" },
          };
          list.innerHTML = state.relevantSources
            .map(function (s) {
              var cfg = tc[s.sourceType] || tc.blog;
              return (
                '<div class="source-item"><div class="src-icon" style="background:' +
                cfg.color +
                "15;color:" +
                cfg.color +
                '"><i class="' +
                cfg.icon +
                '"></i></div><div><div class="src-title">' +
                s.title +
                '</div><div class="src-url">' +
                s.url +
                "</div></div></div>"
              );
            })
            .join("");
        }

        function copyArticle() {
          var raw = state.articles[state.activePlatform];
          if (!raw) return;
          navigator.clipboard
            .writeText(raw)
            .then(function () {
              showToast(
                "Copied " +
                  PLATFORMS[state.activePlatform].name +
                  " article to clipboard",
                "success",
              );
            })
            .catch(function () {
              var ta = document.createElement("textarea");
              ta.value = raw;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
              showToast("Copied to clipboard", "success");
            });
        }

        function downloadMarkdown() {
          var raw = state.articles[state.activePlatform];
          if (!raw) return;
          var fn =
            state.activePlatform +
            "-" +
            document
              .getElementById("topicInput")
              .value.trim()
              .replace(/\s+/g, "-")
              .substring(0, 40) +
            ".md";
          var blob = new Blob([raw], { type: "text/markdown" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = fn;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("Downloaded " + fn, "success");
        }

        /* ====== EVENT LISTENERS ====== */
        document
          .getElementById("styleSelector")
          .addEventListener("click", function (e) {
            var btn = e.target.closest(".style-btn");
            if (!btn) return;
            document.querySelectorAll(".style-btn").forEach(function (b) {
              b.classList.remove("active");
            });
            btn.classList.add("active");
            state.style = btn.dataset.style;
          });
        document
          .getElementById("platformSelector")
          .addEventListener("click", function (e) {
            var chip = e.target.closest(".plat-chip");
            if (!chip) return;
            chip.classList.toggle("active");
            state.platforms = [];
            document
              .querySelectorAll(".plat-chip.active")
              .forEach(function (c) {
                state.platforms.push(c.dataset.platform);
              });
          });
        document
          .getElementById("sourceSelector")
          .addEventListener("change", function () {
            state.sources = [];
            document
              .querySelectorAll("#sourceSelector input:checked")
              .forEach(function (i) {
                state.sources.push(i.value);
              });
          });
        document
          .getElementById("generateBtn")
          .addEventListener("click", handleGenerate);
        document
          .getElementById("copyBtn")
          .addEventListener("click", copyArticle);
        document
          .getElementById("downloadBtn")
          .addEventListener("click", downloadMarkdown);
        document
          .getElementById("redoBtn")
          .addEventListener("click", handleGenerate);
        document.querySelectorAll(".suggestion-chip").forEach(function (chip) {
          chip.addEventListener("click", function () {
            document.getElementById("topicInput").value = this.dataset.suggest;
            document.getElementById("topicInput").focus();
          });
        });
        document.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            e.preventDefault();
            handleGenerate();
          }
        });
      })();
    </script>
  </body>
</html>
